<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>

        body {

            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f0fdfa;
            color: #23413e;
            line-height: 1.6;
        }

        main {
            background: white;
            max-width: 520px;
            width: 100%;
            padding: 35px;

            border-top: 5px solid #0f766e;
            box-shadow: 0 8px 24px #0f766e0f;

        .tag {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: #ccfbf1;
            color: #134e4a;
            font-size: 12px;
            font-weight: bold;
        }

        h1 {
            color: #134e4a;
            margin: 15px 0 5px;
        }

        p {
            margin: 5px 0;
            color: #647875;
        }

    <span class="tag">WEB PROGRAMMING · WEEK 9</span>
